name: Render budget

# Fails when a change makes a frame ask more of the canvas than
# bench/baseline.json allows. See bench/bench.js for what is counted.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  art-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # The runner image already has Chromium's libraries. The extra system
      # packages are mostly fonts; when the package mirror is unreachable,
      # carry on without them instead of failing before any check has run.
      - name: Install Chromium system packages (best effort)
        run: timeout -k 10 240 npx playwright install-deps chromium || echo "::warning::Chromium system packages were not installed; text may use fallback fonts."
      - run: npm test
      - run: npm run build
      - run: node bench/concept-verify.js
      - run: node bench/gait-review.js --out=docs/screenshots/runner-rig
      - run: node bench/rig-sheet.js --out=docs/screenshots/runner-rig
      - name: Capture matching base and proposed game frames
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../art-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" ../art-base/node_modules
          node bench/art-review.js --root=../art-base --tag=before
          node bench/art-review.js --tag=after
      - uses: actions/upload-artifact@v4
        with:
          name: art-review
          path: |
            docs/screenshots/courier-pass/*.png
            docs/screenshots/concept/*.png
            docs/screenshots/gait/*.png
            docs/screenshots/runner-rig/*
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # The runner image already has Chromium's libraries. The extra system
      # packages are mostly fonts; when the package mirror is unreachable,
      # carry on without them instead of failing before any check has run.
      - name: Install Chromium system packages (best effort)
        run: timeout -k 10 240 npx playwright install-deps chromium || echo "::warning::Chromium system packages were not installed; text may use fallback fonts."
      - run: npm run test:render
      - run: npm run bench:check
      - run: npm run bench:runs -- --track=0 --runs=4 --frames=1200 --check
